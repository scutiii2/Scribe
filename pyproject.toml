[project]
name = "scribe"
version = "0.1.0"
description = "Speech-to-text MCP server for Citadel and Ember"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
